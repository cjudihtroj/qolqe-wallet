# QUÉ ES: configuración de pytest (el ejecutor de pruebas).
# - pythonpath / testpaths: dónde está el código y dónde buscar pruebas (venían del curso).
# - bdd_features_base_dir: carpeta de los .feature para pytest-bdd (agregado).
# - filterwarnings: oculta advertencias que no son errores, p. ej. etiquetas como
#   @HU-G2-01 que pytest no conoce de antemano (agregado).
[pytest]
pythonpath = .
testpaths = tests
bdd_features_base_dir = features
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning
    ignore::DeprecationWarning
